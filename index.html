<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cuestionario semanal · mada nutrición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mada.css?v=20261003">
</head>
<body>
<!-- MADA · Cuestionario semanal (2026-10-01: mismas preguntas y claves que la versión anterior,
     sobre el motor común mada.js y con la marca nueva). Enlace: ?t=token&w=lunes&n=nombre.
     Página estática (GitHub Pages) → POST al doPost del Apps Script → pestaña RESPUESTAS. -->
<div class="wrap">
  <div id="invalid" style="display:none">
    <div class="brand"><span class="wordmark">mada<sup>©</sup></span></div>
    <div class="invalid-link">
      <h2 class="step-title">Enlace no válido</h2>
      <p class="step-desc" style="margin-top:8px;">Este enlace está incompleto.<br>Pide a tu nutricionista que te lo reenvíe.</p>
    </div>
  </div>
  <div id="app" style="display:none"></div>
</div>
<script src="mada.js?v=20261003"></script>
<script>
  // Si algún día cambia la URL /exec del Apps Script, se actualiza SOLO esta constante.
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzDt5caDvdEflEsBOUBldg51Zm5GO_rv7yb8Tvi7xvp4FPO4zFOr2xmxoo-6ybuRs6Wqw/exec';

  var Q = new URLSearchParams(location.search);
  var TOKEN = (Q.get('t') || '').trim();
  var CLIENT_NAME = (Q.get('n') || '').trim();
  function mondayOf(d) { var day = (d.getDay() + 6) % 7; var m = new Date(d); m.setDate(d.getDate() - day); m.setHours(12, 0, 0, 0); return m; }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var WEEK_START = (Q.get('w') || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(WEEK_START)) WEEK_START = ymd(mondayOf(new Date()));
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  if (!TOKEN) {
    document.getElementById('invalid').style.display = 'block';
  } else {
    document.getElementById('app').style.display = 'block';
    var ws = new Date(WEEK_START + 'T12:00:00'), we = new Date(ws); we.setDate(ws.getDate() + 6);
    var opt = function (id, label, ph) { return { id: id, label: label, opt: true, type: 'text', ph: ph }; };

    MadaForm.mount({
      root: '#app',
      brand: { kicker: 'Seguimiento semanal', greeting: CLIENT_NAME ? 'Hola, ' + CLIENT_NAME : 'Hola',
               meta: 'Semana del ' + ws.getDate() + ' de ' + MESES[ws.getMonth()] + ' al ' + we.getDate() + ' de ' + MESES[we.getMonth()] },
      draftKey: 'mada_q_' + TOKEN + '_' + WEEK_START,
      execUrl: EXEC_URL,
      base: { token: TOKEN, week_start: WEEK_START },
      numeric: true,
      steps: [
        { key: 'peso', name: 'Peso', title: 'Tu peso esta semana', desc: 'Apunta los días que te hayas pesado (en ayunas). Los que no tengas, déjalos en blanco.', fields: [
          { id: 'pesos', type: 'weights', weekStart: WEEK_START }
        ]},
        { key: 'descanso', name: 'Descanso y energía', title: 'Descanso y energía', desc: '¿Cómo te has sentido en general durante la semana?', fields: [
          { id: 'cansancio_0_10', type: 'slider', label: 'Nivel de cansancio', emojis: ['⚡', '😊', '😐', '🥱', '😵'], minLabel: 'Con energía', maxLabel: 'Agotado/a' },
          opt('causa_cansancio', '¿A qué crees que se debe?', 'Trabajo, poco sueño, entrenos…'),
          { id: 'calidad_sueno_0_10', type: 'slider', label: 'Calidad del sueño', emojis: ['😫', '😕', '😐', '🙂', '😴'], minLabel: 'Muy mala', maxLabel: 'Excelente' },
          { id: 'horas_sueno', label: 'Horas de sueño', hint: 'Media por noche.', type: 'number', ph: '7.5', min: 0, max: 16, step: 0.5 },
          { id: 'animo_0_10', type: 'slider', label: 'Estado de ánimo', emojis: ['😞', '😕', '😐', '🙂', '😄'], minLabel: 'Muy bajo', maxLabel: 'Genial' },
          opt('notas_sueno', 'Notas sobre el descanso', 'Me despierto por la noche, madrugones…')
        ]},
        { key: 'alimentacion', name: 'Alimentación', title: 'Alimentación y digestión', desc: 'Sobre cómo te ha sentado el plan esta semana.', fields: [
          { id: 'saciedad_0_10', type: 'slider', label: 'Saciedad', emojis: ['😣', '😕', '😐', '🙂', '😌'], minLabel: 'Paso hambre', maxLabel: 'Muy saciado/a' },
          opt('hambre_notas', '¿Hambre a alguna hora concreta?', 'Media tarde, antes de cenar…'),
          { id: 'digestiones_0_10', type: 'slider', label: 'Digestiones', emojis: ['🤢', '😕', '😐', '🙂', '✨'], minLabel: 'Muy malas', maxLabel: 'Perfectas' },
          opt('molestias_digestivas', '¿Molestias digestivas?', 'Hinchazón, acidez, gases…'),
          { id: 'hidratacion_0_10', type: 'slider', label: 'Hidratación', emojis: ['🏜️', '😕', '😐', '🙂', '💧'], minLabel: 'Muy poca agua', maxLabel: 'Muy bien' }
        ]},
        { key: 'plan', name: 'Tu plan', title: 'Tu menú semanal', desc: 'Esto nos ayuda a ajustar los platos de las próximas semanas.', fields: [
          { id: 'adherencia_0_10', type: 'slider', label: '¿Cuánto has seguido el plan esta semana?', emojis: ['🙈', '😬', '😐', '🙂', '🎯'], minLabel: 'Casi nada', maxLabel: 'Al 100 %' },
          { id: 'satisfaccion_menu', label: '¿Contento/a con el menú?', type: 'text', ph: 'Sí, aunque repetiría menos las cenas…' },
          { id: 'aburrimiento_0_10', type: 'slider', label: '¿Te aburre el menú?', emojis: ['🤩', '🙂', '😐', '🥱', '😪'], minLabel: 'Para nada', maxLabel: 'Mucho' },
          { id: 'dificultades_plan', label: '¿Dificultades para seguir el plan?', opt: true, type: 'textarea', ph: 'Comidas fuera, falta de tiempo para cocinar…' },
          opt('cambios_platos', '¿Cambiarías algún plato?', 'El salmón del martes por otro pescado…'),
          opt('platos_favoritos', '¿Platos favoritos de la semana?', 'El curry de garbanzos')
        ]},
        { key: 'actividad', name: 'Actividad', title: 'Actividad y último apunte', desc: 'Ya casi está. Un par de datos más y terminamos.', fields: [
          { id: 'pasos_diarios', label: 'Pasos diarios', hint: 'Media, según tu reloj o móvil.', opt: true, type: 'number', ph: '10000', int: true, min: 0, max: 80000, step: 100 },
          { id: 'entrenos_json', label: 'Entrenos de esta semana', hint: 'Toca lo que hayas hecho. Totales de la semana: sesiones, horas, kilómetros, cómo de duro ha sido (0 = paseo, 10 = al límite) y, si tu reloj la da, la frecuencia cardíaca media.', opt: true, type: 'sport_totals' },
          opt('ejercicio_extra', '¿Ejercicio fuera de lo programado?', 'Ruta el sábado, pádel el jueves…'),
          { id: 'proxima_semana', label: '¿Algo que deba saber para la semana que viene?', hint: 'Viajes, comidas fuera, celebraciones, cambios de horario o de entrenos… para adaptar el plan antes, no después.', opt: true, type: 'textarea', ph: 'Cena de empresa el jueves, fin de semana fuera…' },
          { id: 'comentarios', label: '¿Algo más que quieras contarme?', opt: true, type: 'textarea', ph: 'Dudas, sensaciones, lo que sea…' }
        ]}
      ],
      success: { title: '¡Enviado!', text: 'Tus respuestas ya están con tu nutricionista. ¡Sigue así!',
        titleFor: function () { return CLIENT_NAME ? '¡Listo, ' + CLIENT_NAME + '!' : ''; } }
    });
  }
</script>
</body>
</html>
